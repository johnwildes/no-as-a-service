name: Deploy Bicep to Azure

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Bicep file
      run: |
        RG_NAME="${{ vars.AZURE_RESOURCE_GROUP }}-$(head -c 8 /dev/urandom | tr -dc 'a-z0-9' | head -c 4)"
        az group create \
          --name "$RG_NAME" \
          --location "${{ vars.AZURE_LOCATION }}"
        az deployment group create \
          --resource-group "$RG_NAME" \
          --template-file inf/main.bicep \
          --parameters @inf/parameters.json
